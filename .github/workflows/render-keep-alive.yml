name: Render keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render backend
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          set -euo pipefail
          if [ -z "${BACKEND_URL:-}" ]; then
            echo "RENDER_BACKEND_URL secret is not set in the repo settings"
            exit 1
          fi
          url="${BACKEND_URL%/}/api/ping"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$url")
          echo "GET $url -> HTTP $code"
          test "$code" = "200"
